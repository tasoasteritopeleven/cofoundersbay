name: Deploy web to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target
        required: true
        default: preview
        type: choice
        options: [preview, production]

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The web app imports @cofounderbay/shared through its built `dist`,
      # which is gitignored: without this step the typecheck below cannot
      # resolve the package (141 TS2307/TS7006 errors on a clean checkout).
      - name: Build shared package
        run: pnpm --filter @cofounderbay/shared run build

      - name: Typecheck
        run: pnpm --filter @cofounderbay/web exec tsc --noEmit -p tsconfig.json

      - name: Build worker bundle
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm run cf:build

      # The build above runs without credentials, so a fork or a fresh repo
      # still proves the bundle; only the upload needs them. Name what is
      # missing instead of letting wrangler fail on an empty token.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings → Secrets and variables → Actions (docs/CLOUDFLARE_DEPLOYMENT.md, One-time setup)."
            exit 1
          fi

      - name: Deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy
