# CoFounderBay — local development stack
# Run: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: cofounderbay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cofounderbay
      POSTGRES_PASSWORD: cofounderbay_dev
      POSTGRES_DB: cofounderbay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cofounderbay -d cofounderbay"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cofounderbay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: cofounderbay-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: cofounderbay_meili_dev_key_change_in_prod
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  meili_data:
