<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    CoFounderBay — surfer on the board at sunset, cofounder under the board.
    Same scene as public/icons/logo-surf.png and components/brand/Logo.tsx.
  -->
  <defs>
    <linearGradient id="sky" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="38%" stop-color="#EA580C"/>
      <stop offset="62%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="sun" cx="56%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
  </defs>
  <rect width="48" height="48" rx="13" fill="url(#sky)"/>
  <circle cx="27" cy="19" r="13" fill="url(#sun)"/>
  <path fill="#1E1B4B" d="M0 29.5C8 26.5 16 29 24 28c8-1 16-3.5 24-1v21H0Z"/>
  <path fill="#312E81" opacity=".55" d="M0 33c9-2 18 1 28-1 8-1.5 14 1 20 0v16H0Z"/>
  <g transform="rotate(-14 22 27.4)">
