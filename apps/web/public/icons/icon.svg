  </g>
  <!-- Surfer -->
  <circle cx="18.2" cy="18.4" r="2.4" fill="#1E1B4B"/>
  <path d="M17.1 20.6c.5 2.5 2.4 4.4 5.6 5.8" stroke="#1E1B4B" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M18.5 22.1c-2.7-1.1-4.8-2.5-6.5-4.2" stroke="#1E1B4B" stroke-width="2" stroke-linecap="round"/>
  <path d="M20.2 24.8 18.6 27.4" stroke="#1E1B4B" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cofounder under the board -->
  <circle cx="25.4" cy="35.6" r="2.2" fill="#0F172A"/>
  <path d="M24 33.9 21.6 28.6M26.9 33.9 29.6 29" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
  <path d="M24.4 37.2c.5 2.6 2.3 4.4 1.1 5.8" stroke="#0F172A" stroke-width="2" stroke-linecap="round"/>
